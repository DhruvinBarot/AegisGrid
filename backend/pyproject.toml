[project]
name = "aegisgrid"
version = "0.1.0"
description = "Multi-tenant control plane for enterprise AI agents"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "uuid-utils>=0.10",
    "rfc8785>=0.1.4",
    "jmespath>=1.0.1",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# One loop for the whole run: the module-level engine/redis pools are bound to the loop that first uses them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated-then-edited migration: keep Alembic's rendering.
"migrations/versions/*" = ["E501", "I001", "UP"]

[tool.pyright]
include = ["app", "tests", "migrations"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
